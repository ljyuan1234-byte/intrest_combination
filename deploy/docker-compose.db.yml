name: life-assistant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-life}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-life}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-life_assistant}
      DATABASE_SSL: 'false'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
